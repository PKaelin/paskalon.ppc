services:
  # Database
  paskalon.devices.data:
    container_name: paskalon.devices.data
    image: postgres:18.6
    restart: unless-stopped
    ports:
      - 45001:5432
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: devices
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d devices -U $$(cat /run/secrets/db_user)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - paskalon.devices.data:/var/lib/postgresql
    networks:
      - paskalon.network

  # Device Service
  paskalon.devices.service:
    container_name: paskalon.devices.service
    image: ${DOCKER_REGISTRY-}paskalondevicesservice
    build:
      context: .
      dockerfile: paskalON.Devices.Service/Dockerfile
    depends_on:
      paskalon.devices.data:
        condition: service_healthy
    ports:
      - 45000:8080
    environment:
      - DATABASE_CONNECTION_FILE=/run/secrets/database_connection
      - MESSAGING_CONNECTION_FILE=/run/secrets/messaging_connection
    secrets:
      - database_connection
      - messaging_connection
    networks:
      - paskalon.network

secrets:
  database_connection:
    file: ./secrets/database_connection
  messaging_connection:
    file: ./secrets/messaging_connection
  db_user:
    file: ./secrets/db_user
  db_password:
    file: ./secrets/db_password

volumes:
  paskalon.devices.data:
    name: paskalon.devices.data

networks:
  paskalon.network:
    name: paskalon.network
    # Attachable only for development and test
    attachable: true