# This Docker compose file is only used in DEV & TST.
# QA and PRD will use docker stack and orchestration.
# Contains the PostgreSQL databases of all microservices. Loaded via docker-compose.yaml together with infra.yaml.
# Network is defined as attachable so that the microservice containers can attach to the same network.
# Dont use random ports use Microservice Development Port Assignments:
# Add new database registration to ./pgadmin/servers.json
name: paskalon_ppc_infra

services:

  # Device Service database (paskalON.Devices.Data)
  paskalon.devices.data:
    container_name: paskalon.devices.data
    image: postgres:18.6
    restart: unless-stopped
    # Expose ports only in DEV/TST environments!
    ports:
      - 45001:5432
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: devices
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d devices -U $$(cat /run/secrets/db_user)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - paskalon.devices.data:/var/lib/postgresql
    networks:
      - ppc.network


  # Power Controls Service database (paskalON.PowerControls.Data)
  paskalon.powercontrols.data:
    container_name: paskalon.powercontrols.data
    image: postgres:18.6
    restart: unless-stopped
    # Expose ports only in DEV/TST environments!
    ports:
      - 45011:5432
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: powercontrols
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d powercontrols -U $$(cat /run/secrets/db_user)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - paskalon.powercontrols.data:/var/lib/postgresql
    networks:
      - ppc.network


  # Operating Mode Service database (paskalON.OperatingModes.Data)
  paskalon.operatingmodes.data:
    container_name: paskalon.operatingmodes.data
    image: postgres:18.6
    restart: unless-stopped
    # Expose ports only in DEV/TST environments!
    ports:
      - 45021:5432
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: operatingmodes
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d operatingmodes -U $$(cat /run/secrets/db_user)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - paskalon.operatingmodes.data:/var/lib/postgresql
    networks:
      - ppc.network


  # Alarm Service database (paskalON.Alarms.Data)
  paskalon.alarms.data:
    container_name: paskalon.alarms.data
    image: postgres:18.6
    restart: unless-stopped
    # Expose ports only in DEV/TST environments!
    ports:
      - 45031:5432
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: alarms
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d alarms -U $$(cat /run/secrets/db_user)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - paskalon.alarms.data:/var/lib/postgresql
    networks:
      - ppc.network


  # Device Simulator database (paskalON.DeviceSimulator.Data)
  paskalon.devicesimulator.data:
    container_name: paskalon.devicesimulator.data
    image: postgres:18.6
    restart: unless-stopped
    # Expose ports only in DEV/TST environments!
    ports:
      - 45501:5432
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: devicesimulator
    secrets:
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d devicesimulator -U $$(cat /run/secrets/db_user)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - paskalon.devicesimulator.data:/var/lib/postgresql
    networks:
      - ppc.network


# Volumes for the databases
volumes:
  paskalon.devices.data:
    name: paskalon.devices.data
  paskalon.powercontrols.data:
    name: paskalon.powercontrols.data
  paskalon.operatingmodes.data:
    name: paskalon.operatingmodes.data
  paskalon.alarms.data:
    name: paskalon.alarms.data
  paskalon.devicesimulator.data:
    name: paskalon.devicesimulator.data


# Secrets have to be changed in QAT/PRD according to ./secrets/README.md
secrets:
  db_user:
    file: ./secrets/db_user
  db_password:
    file: ./secrets/db_password


# Networks for the services (identical definition as in infra.yaml)
networks:
  ppc.network:
    name: ppc.network
    # Attachable only for development and test
    attachable: true
