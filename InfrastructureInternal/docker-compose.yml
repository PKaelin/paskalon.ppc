# This Docker compose file is only used in DEV & TST.
# QA and PRD will use docker stack and orchestration.
# Network is defined as attachable so that we can easely spin up more container and attach them to the same network.
# Dont use random ports use Microservice Development Port Assignments:
name: paskalon_ppc_infra

services:

  # PgAdmin database management user interface (for all the databases within network).
  # Add new database registration to ./pgadmin/servers.json
  # This service is only for DEV/TST environments and shall not be deployed in PRD!
  pgadmin:
    container_name: paskalon.pgadmin
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    ports:
      - 41001:80
    environment:
      # Email is missing secrets implementation. PGADMIN_DEFAULT_EMAIL needs to be replaced for QAT/PRD.
      - PGADMIN_DEFAULT_EMAIL=admin@ppc.com
      - PGADMIN_DEFAULT_PASSWORD_FILE=/run/secrets/pgadmin_password
      # For development mode disable login
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - paskalon.pgadmin:/var/lib/pgadmin
      - ./pgadmin/preferences.json:/pgadmin4/preferences.json
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - ppc.network
    secrets:
      - pgadmin_password


  # Redis for high-performance, in-memory data structure store
  redis:
    container_name: paskalon.redis
    image: redis:8.10.1
    restart: unless-stopped
    # Expose ports only in DEV/TST environments!
    ports:
      - 41002:6379
    volumes:
      - paskalon.redis:/data
      - ./redis/redis.config:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - ppc.network


  # OpenTelemetry collector for processeing and forwarding telemetry
  collector:
    container_name: paskalon.collector
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./opentelemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - ppc.network


  # Loki horizontally scalable, highly available, multi-tenant log aggregation system.
  # Test ready with: [Get] http://localhost:41003/ready
  # API documentaiton: https://grafana.com/docs/loki/latest/reference/loki-http-api
  loki:
    container_name: paskalon.loki
    image: grafana/loki:3.6.16
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    # Expose ports only in DEV/TST environments!
    ports:
      - 41003:3100
    volumes:
      - paskalon.loki:/data
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - ppc.network


  # Influxdb metrics database container.
  # Test health with: [GET] http://localhost:41004/health
  # API documentation: https://docs.influxdata.com/influxdb3/core/api/v3/
  influxdb:
    container_name: paskalon.influxdb
    image: influxdb:3.11.0-core
    restart: unless-stopped
    # Expose ports only in DEV/TST environments!
    ports:
      - 41004:8181
    command:
      - /bin/sh
      - -c
      - |
        echo "Starting InfluxDB..."
        influxdb3 serve \
          --node-id=infnod \
          --object-store=file \
          --data-dir=/var/lib/influxdb3/data \
          --plugin-dir=/var/lib/influxdb3/plugins \
          --without-auth &
        INFLUXDB_PID=$$!

        echo "Waiting for InfluxDB to become ready..."
        until curl -sf http://localhost:8181/health > /dev/null; do
          sleep 1
        done

        echo "Creating database ppc if necessary..."
        if influxdb3 show databases --host http://localhost:8181 | grep -q 'ppc'; then
          echo 'Database ppc already exists. Skipping initialization.';
        else
          echo 'Creating initial database...';
          influxdb3 create database --retention-period 1d --host http://localhost:8181 ppc;
          echo 'Database initialization complete!';
        fi
        echo "InfluxDB is ready."
        wait $$INFLUXDB_PID
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - paskalon.indluxdb:/var/lib/influxdb3
    networks:
      - ppc.network

  # Tempo is an open source, easy-to-use, and high-scale distributed tracing backend.
  # Run with local storage, only one instance, no failover.
  # Test ready with: [GET] http://localhost:41005/ready
  tempo:
    container_name: paskalon.tempo
    image: grafana/tempo:3.0.3
    restart: unless-stopped
    # Expose ports only in DEV/TST environments!
    ports:
      # For test purpose expose WebApi
      - 41005:3200    # http api
    volumes:
      - paskalon.tempo:/var/tempo
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    command: [ "-config.file=/etc/tempo.yaml" ]
    networks:
      - ppc.network   


  # Grafana monitor, visualize data, dashboard and query container container.
  # This service is only for DEV/TST environments and shall not be deployed in PRD!
  # Use the Grafana service in the external infrastructure in UAT/PRD.
  grafana:
    container_name: paskalon.grafana
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    depends_on:
      - influxdb
      - loki
      - tempo
    ports:
      - 41006:3000
    environment:
      - GF_USERS_DEFAULT_THEME=dark
      - GRAFANA_PORT=3000
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/grafana_user
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
      # For development disable login and enable anonymous (Viewer, Editor, Admin)
      - GF_AUTH_DISABLE_LOGIN_FORM=True
      - GF_AUTH_ANONYMOUS_ENABLED=True
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - paskalon.grafana:/var/lib/grafana
      # Mount datasources and dashboards
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    networks:
      - ppc.network
    secrets:
      - grafana_user
      - grafana_password

# Volumes for the services
volumes:
  paskalon.pgadmin:
  paskalon.redis:
  paskalon.loki:  
  paskalon.indluxdb:
  paskalon.tempo:
  paskalon.grafana:


# Secrets have to be changed in QAT/PRD according to ./secrets/README.md
secrets:
  pgadmin_password:
    file: ./secrets/pgadmin_password
  grafana_user:
    file: ./secrets/grafana_user
  grafana_password:
    file: ./secrets/grafana_password


# Networks for the services
networks:
  ppc.network:
    name: ppc.network
    # Attachable only for development and test
    attachable: true
