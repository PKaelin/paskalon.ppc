services:
  # Database (paskalON.OperatingModes.Data)
  # The PostgreSQL database container paskalon.operatingmodes.data is in the internal infrastructure:
  # ../InfrastructureInternal/data.yaml (loaded by ../InfrastructureInternal/docker-compose.yaml).
  # Start the internal infrastructure before starting this service.

  # Operating Mode Service
  paskalon.operatingmodes.service:
    container_name: paskalon.operatingmodes.service
    image: ${DOCKER_REGISTRY-}paskalonoperatingmodesservice
    build:
      context: .
      dockerfile: paskalON.OperatingModes.Service/Dockerfile
    ports:
      - 45020:8080
    environment:
      - DATABASE_CONNECTION_FILE=/run/secrets/database_connection
      - MESSAGING_CONNECTION_FILE=/run/secrets/messaging_connection
      - DEVICESERVICE_CONNECTION_FILE=/run/secrets/deviceservice_connections
      - TELEMETRY_LOGGING_ENDPOINT=http://collector:4317
      - TELEMETRY_METRICS_ENDPOINT=http://collector:4317
      - TELEMETRY_TRACING_ENDPOINT=http://collector:4317
      - STARTUP_RETRY_COUNT=6
      - STARTUP_RETRY_INTERVAL_SECONDS=15
      - START_PUBLISHERS=true
      - DEVICE_SERVICE_ENDPOINT=/api/v1
    secrets:
      - database_connection
      - messaging_connection
      - deviceservice_connections
    networks:
      - ppc.network

secrets:
  database_connection:
    file: ./secrets/database_connection
  messaging_connection:
    file: ./secrets/messaging_connection
  deviceservice_connections:
    file: ./secrets/deviceservice_connections

networks:
  ppc.network:
    name: ppc.network
    # Attachable only for development and test
    attachable: true