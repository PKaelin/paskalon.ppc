services:
  # Database (paskalON.Alarms.Data)
  # The PostgreSQL database container paskalon.alarms.data is in the internal infrastructure:
  # ../InfrastructureInternal/data.yaml (loaded by ../InfrastructureInternal/docker-compose.yaml).
  # Start the internal infrastructure before starting this service.

  # Alarm Service
  paskalon.alarms.service:
    container_name: paskalon.alarms.service
    image: ${DOCKER_REGISTRY-}paskalonalarmsservice
    build:
      context: .
      dockerfile: paskalON.Alarms.Service/Dockerfile
    ports:
      - 45030:8080
    environment:
      - DATABASE_CONNECTION_FILE=/run/secrets/database_connection
      - MESSAGING_CONNECTION_FILE=/run/secrets/messaging_connection
      - RABBITMQ_CONNECTION_FILE=/run/secrets/rabbitmq_connection
      - DEVICESERVICE_CONNECTION_FILE=/run/secrets/deviceservice_connection
      - DEVICE_SERVICE_ENDPOINT=/api/v1
      - TELEMETRY_LOGGING_ENDPOINT=http://collector:4317
      - TELEMETRY_METRICS_ENDPOINT=http://collector:4317
      - TELEMETRY_TRACING_ENDPOINT=http://collector:4317
      - STARTUP_RETRY_COUNT=6
      - STARTUP_RETRY_INTERVAL_SECONDS=15
    secrets:
      - database_connection
      - messaging_connection
      - rabbitmq_connection
      - deviceservice_connection
    networks:
      - ppc.network

secrets:
  database_connection:
    file: ./secrets/database_connection
  messaging_connection:
    file: ./secrets/messaging_connection
  rabbitmq_connection:
    file: ./secrets/rabbitmq_connection
  deviceservice_connection:
    file: ./secrets/deviceservice_connection

networks:
  ppc.network:
    name: ppc.network
    # Attachable only for development and test
    attachable: true
