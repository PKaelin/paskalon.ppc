services:
  # Luna service
  paskalon.luna.service:
    container_name: paskalon.luna.service
    image: ${DOCKER_REGISTRY-}paskalonlunaservice
    build:
      context: .
      dockerfile: paskalON.Luna.Service/Dockerfile
    ports:
      - 45550:8080
    environment:
      - MESSAGING_CONNECTION_FILE=/run/secrets/messaging_connection
      - DEVICESERVICE_CONNECTION_FILE=/run/secrets/deviceservice_connection
      - DEVICE_SERVICE_ENDPOINT=/api/v1
      - OPERATINGMODE_CONNECTION_FILE=/run/secrets/operatingmode_connection
      - OPERATINGMODE_SERVICE_ENDPOINT=/api/v1
      - TELEMETRY_LOGGING_ENDPOINT=http://collector:4317
      - TELEMETRY_METRICS_ENDPOINT=http://collector:4317
      - TELEMETRY_TRACING_ENDPOINT=http://collector:4317
      - STARTUP_RETRY_COUNT=6
      - STARTUP_RETRY_INTERVAL_SECONDS=15
    secrets:
      - messaging_connection
      - deviceservice_connection
      - operatingmode_connection
    networks:
      - ppc.network


  # Luna web application
  paskalon.luna.web:
    container_name: paskalon.luna.web
    image: paskalon.luna.web:latest
    restart: unless-stopped
    build:
      context: ./paskalON.Luna.Web
      dockerfile: Dockerfile
    depends_on:
      - paskalon.luna.service
    ports:
      - 45552:8080
    environment:
      - LUNA_API_URL=http://paskalon.luna.service:8080
      - APP_API_BASE_URL=/api
    networks:
      - ppc.network

secrets:
  messaging_connection:
    file: ./secrets/messaging_connection
  deviceservice_connection:
    file: ./secrets/deviceservice_connection
  operatingmode_connection:
    file: ./secrets/operatingmode_connection

networks:
  ppc.network:
    name: ppc.network
    # Attachable only for development and test
    attachable: true